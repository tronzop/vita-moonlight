name: Build PSVita (CMake)

on:
  push:
    branches: [ vita, perf ]
  pull_request:
    branches: [ vita ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 curl git

      - name: Install VitaSDK and packages
        run: |
          set -e
          SDK_URL=$(wget -qO- https://github.com/vitasdk/vita-headers/raw/master/.travis.d/last_built_toolchain.py | python3 - master linux)
          echo "Downloading VitaSDK: $SDK_URL"
          mkdir -p $VITASDK
          wget -qO- "$SDK_URL" | tar xj -C $VITASDK --strip-components=1
          export PATH=$VITASDK/bin:$PATH
          # The SDK's bundled vdpm; vdpm master now requires pacman.
          for p in zlib bzip2 zstd openssl curl expat opus libvita2d freetype libpng libjpeg-turbo; do
            vdpm $p
          done
          echo "$VITASDK/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ env.VITASDK }}/share/vita.toolchain.cmake" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -C build

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-vpk
          path: build/*.vpk
