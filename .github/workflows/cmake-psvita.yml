name: Build PSVita (CMake)

on:
  push:
    branches: [ vita, perf ]
  pull_request:
    branches: [ vita ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 curl git

      - name: Install VitaSDK and packages
        run: |
          set -e
          # Pinned: the "latest toolchain" lookup hits the anonymous GitHub API rate limit on shared runners.
          SDK_URL=https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.540/vitasdk-x86_64-linux-gnu-2026-05-24_12-05-02.tar.bz2
          mkdir -p $VITASDK
          wget -qO- "$SDK_URL" | tar xj -C $VITASDK --strip-components=1
          export PATH=$VITASDK/bin:$PATH
          # The SDK's bundled vdpm; vdpm master now requires pacman.
          for p in zlib bzip2 zstd openssl curl expat opus libvita2d freetype libpng libjpeg-turbo; do
            vdpm $p
          done
          echo "$VITASDK/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ env.VITASDK }}/share/vita.toolchain.cmake" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -C build

      - name: Upload VPK artifact
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-vpk
          path: build/*.vpk

      # Forgejo's artifact store only speaks the v3 protocol.
      - name: Upload VPK artifact (Forgejo)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: moonlight-vpk
          path: build/*.vpk
